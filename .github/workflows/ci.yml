name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Compile Python files
        run: python -m compileall -q src
      - name: Run Ruff
        run: python -m ruff check .
      - name: Run mypy
        run: python -m mypy src
      - name: Run tests and coverage gate
        run: python -m pytest
      - name: Build source and wheel packages
        run: python -m build

  launcher-smoke:
    name: Launcher smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Check Bash syntax
        run: bash -n start-linux.sh scripts/*.sh
      - name: Exercise a no-write preview
        env:
          PYTHONPATH: src
        run: >-
          python -m newbie_project_builder --dry-run create
          --name "CI Practice Project"
          --kind python-cli
          --visibility local-only
          --parent "$RUNNER_TEMP/projects"
      - name: Confirm preview created no project folder
        shell: bash
        run: test ! -e "$RUNNER_TEMP/projects/ci-practice-project"
      - name: Generate a real Python CLI template
        env:
          PYTHONPATH: src
        run: >-
          python -m newbie_project_builder create
          --name "Generated Template Smoke Test"
          --kind python-cli
          --visibility local-only
          --parent "$RUNNER_TEMP/generated"
      - name: Check generated Bash helper syntax
        working-directory: ${{ runner.temp }}/generated/generated-template-smoke-test
        shell: bash
        run: bash -n scripts/setup.sh scripts/check.sh
      - name: Run the generated template tests
        working-directory: ${{ runner.temp }}/generated/generated-template-smoke-test
        env:
          PYTHONPATH: src
        run: python -m pytest
