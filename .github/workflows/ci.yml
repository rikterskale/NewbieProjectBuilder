name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Compile Python files
        run: python -m compileall -q src
      - name: Run Ruff
        run: python -m ruff check .
      - name: Run mypy
        run: python -m mypy src
      - name: Run tests and coverage gate
        run: python -m pytest
      - name: Build source and wheel packages
        run: python -m build

  linux-launcher-smoke:
    name: Linux launcher and generated-project smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Check Bash syntax
        run: bash -n start-linux.sh scripts/*.sh
      - name: Run the Linux diagnostic wrapper
        run: bash scripts/diagnose-linux.sh
      - name: Exercise a no-write preview
        env:
          PYTHONPATH: src
        run: >-
          python -m newbie_project_builder --dry-run create
          --name "CI Practice Project"
          --kind python-cli
          --visibility local-only
          --parent "$RUNNER_TEMP/projects"
      - name: Confirm preview created no project folder
        shell: bash
        run: test ! -e "$RUNNER_TEMP/projects/ci-practice-project"
      - name: Generate a real Python CLI template
        env:
          PYTHONPATH: src
        run: >-
          python -m newbie_project_builder create
          --name "Generated Template Smoke Test"
          --kind python-cli
          --visibility local-only
          --parent "$RUNNER_TEMP/generated"
      - name: Check generated Bash helper syntax
        working-directory: ${{ runner.temp }}/generated/generated-template-smoke-test
        shell: bash
        run: bash -n scripts/setup.sh scripts/check.sh
      - name: Install generated-project development dependencies
        working-directory: ${{ runner.temp }}/generated/generated-template-smoke-test
        run: python -m pip install -e ".[dev]"
      - name: Run the generated template tests
        working-directory: ${{ runner.temp }}/generated/generated-template-smoke-test
        run: python -m pytest

  windows-launcher-smoke:
    name: Windows launcher and check-wrapper smoke tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $files = @(
            "Start-Windows.ps1",
            "scripts/check.ps1",
            "scripts/diagnose-windows.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
      - name: Run the Windows diagnostic wrapper
        shell: pwsh
        run: .\scripts\diagnose-windows.ps1
      - name: Run the Windows all-checks wrapper
        shell: pwsh
        run: .\scripts\check.ps1
