name: Bootstrap MVP source

on:
  push:
    branches:
      - agent/build-cross-platform-mvp
    paths:
      - .bootstrap/**
      - .github/workflows/bootstrap-mvp.yml

permissions:
  contents: write

jobs:
  unpack-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Reassemble and verify the reviewed source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/npb-source.part-* > "$RUNNER_TEMP/npb-source.b64"
          base64 --decode "$RUNNER_TEMP/npb-source.b64" > "$RUNNER_TEMP/npb-source.tar.xz"
          echo "93fd7c8a4d2d4b3f112a28ee2a61f37df58e9fa5b91170642caa863a411757ae  $RUNNER_TEMP/npb-source.tar.xz" | sha256sum --check

      - name: Replace bootstrap payload with the reviewed source tree
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch .
          tar -xJf "$RUNNER_TEMP/npb-source.tar.xz" -C .
          git add -A

      - name: Apply the type-safe disk-usage adapter
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/newbie_project_builder/preflight.py")
          text = path.read_text(encoding="utf-8")
          anchor = "class DiskUsageLike(Protocol):\n    free: int\n\n\nclass Preflight:\n"
          replacement = (
              "class DiskUsageLike(Protocol):\n"
              "    free: int\n\n\n"
              "def _disk_usage(path: Path) -> DiskUsageLike:\n"
              "    return shutil.disk_usage(path)\n\n\n"
              "class Preflight:\n"
          )
          if anchor not in text:
              raise SystemExit("preflight adapter anchor was not found")
          text = text.replace(anchor, replacement, 1)
          text = text.replace(
              "disk_usage: Callable[[Path], DiskUsageLike] = shutil.disk_usage,",
              "disk_usage: Callable[[Path], DiskUsageLike] = _disk_usage,",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip

      - name: Install development checks
        run: python -m pip install -e ".[dev]"

      - name: Validate the extracted implementation
        shell: bash
        run: |
          set -euo pipefail
          python -W error::SyntaxWarning -m compileall -q -f src tests
          python -m ruff check . --fix
          python -m ruff check .
          python -m mypy src
          python -m pytest
          python -m bandit -r src -ll
          bash -n start-linux.sh scripts/*.sh

      - name: Commit the validated implementation to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build cross-platform novice project builder"
          git push origin HEAD:agent/build-cross-platform-mvp
