name: Feature request
description: Suggest a beginner-safe improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What beginner problem should this solve?
      description: Explain the difficulty without prescribing a technical solution.
    validations:
      required: true
  - type: textarea
    id: proposed-experience
    attributes:
      label: What should the user experience?
      description: Include what they click or type, what they see, and how they recover from failure.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and privacy considerations
      description: Describe permissions, remote changes, data, credentials, deletion, or publishing risks.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: What should this request deliberately not do?
