[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "newbie-project-builder"
version = "0.1.0"
description = "Safety-first Windows and Linux project setup for complete beginners."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "rikterskale" }]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.8.6,<2",
  "build>=1.2,<2",
  "mypy>=1.17,<3",
  "pip-audit>=2.9,<3",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
npb = "newbie_project_builder.cli:main"

[project.urls]
Homepage = "https://github.com/rikterskale/NewbieProjectBuilder"
Repository = "https://github.com/rikterskale/NewbieProjectBuilder"
Issues = "https://github.com/rikterskale/NewbieProjectBuilder/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/newbie_project_builder"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=newbie_project_builder",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=95",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["newbie_project_builder"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["A", "ARG", "B", "C4", "DTZ", "E", "F", "I", "N", "PTH", "RUF", "S", "SIM", "UP", "W"]
ignore = ["E501", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "S101", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unreachable = true
pretty = true
show_error_codes = true
